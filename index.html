<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>টাকার হিসাব</title>
<style>
:root{--paper:#EEF2F0;--ink:#14213D;--card:#fff;--line:#D5DDD9;--inc:#2F7D5B;--exp:#B23A48;--mark:#F2A900;--mute:#5B6778}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 'Noto Sans Bengali','Hind Siliguri','Kalpurush',system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:0 14px 40px}
.top{background:var(--ink);color:#fff;margin:0 -14px;padding:calc(env(safe-area-inset-top) + 22px) 20px 22px}
.top small{opacity:.75;display:block}
#bal{font-size:46px;font-weight:700;line-height:1.3;border-bottom:3px solid var(--mark);display:inline-block}
.mo{display:flex;gap:28px;margin-top:14px}
.mo b{display:block;font-size:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:8px;font:inherit;color:var(--ink);font-weight:600}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
input{width:100%;font:inherit;color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
#amt,#s0{font-size:28px;font-weight:700;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:99px;padding:3px 14px;font:inherit;color:var(--ink)}
.chips button[aria-pressed=true]{border-color:var(--ink);background:var(--ink);color:#fff}
.row2{display:grid;grid-template-columns:1fr 150px;gap:8px}
.go{width:100%;margin-top:12px;border:0;border-radius:10px;background:var(--mark);color:var(--ink);font:inherit;font-weight:700;padding:12px}
h2{font-size:15px;margin:22px 0 4px;color:var(--mute);font-weight:600}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.it div{flex:1;min-width:0}
.it small{color:var(--mute);display:block;overflow-wrap:anywhere}
.a{font-weight:700;white-space:nowrap}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.x{border:0;background:none;color:var(--mute);font-size:22px;padding:2px 8px}
.ghost{border:1.5px solid var(--ink);background:none;color:var(--ink);border-radius:10px;font:inherit;padding:8px 14px}
.warn{background:#FFF4D6;border:1px solid var(--mark);border-radius:10px;padding:10px 14px;margin-top:16px}
.warn button{margin-top:6px}
.empty{color:var(--mute);padding:14px 0}
button:focus-visible,input:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header class="top"><small>হাতে আছে</small><div id="bal">৳ ০</div>
<div class="mo"><span><small>এই মাসে আয়</small><b id="mi"></b></span><span><small>এই মাসে খরচ</small><b id="me"></b></span></div></header>

<section id="setup" class="card" hidden>
<label for="s0"><b>এখন তোমার হাতে কত টাকা আছে?</b></label>
<input id="s0" type="number" inputmode="decimal" min="0" step="any" placeholder="০">
<button class="go" id="sgo" type="button">শুরু করো</button>
</section>

<div id="app" hidden>
<div id="bk" class="warn" hidden>৭ দিনের বেশি ব্যাকআপ নেওয়া হয়নি।<br><button class="ghost" id="bk2" type="button">এখনই ব্যাকআপ নাও</button></div>
<form class="card" id="f">
<div class="seg"><button type="button" data-t="exp" aria-pressed="true">খরচ</button><button type="button" data-t="inc" aria-pressed="false">আয়</button></div>
<input id="amt" type="number" inputmode="decimal" min="0.01" step="any" placeholder="কত টাকা?" required aria-label="টাকার পরিমাণ">
<div class="chips" id="chips"></div>
<div class="row2"><input id="note" placeholder="নোট (ঐচ্ছিক)" aria-label="নোট"><input id="date" type="date" aria-label="তারিখ"></div>
<button class="go" type="submit">যোগ করো</button>
</form>
<h2>লেনদেন</h2>
<div id="list"></div>
<h2>ব্যাকআপ</h2>
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="ghost" id="ex" type="button">ব্যাকআপ নাও</button><button class="ghost" id="im" type="button">ব্যাকআপ থেকে ফিরিয়ে আনো</button></div>
<input id="file" type="file" accept="application/json,.json" hidden>
</div>
</main>

<script>
const K='hisab-v1',$=s=>document.querySelector(s),bn=n=>n.toLocaleString('bn-BD',{maximumFractionDigits:2}),
esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
SG={inc:1,exp:-1},START='শুরুর টাকা',r2=n=>Math.round(n*100)/100,
today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)},
fresh=()=>({tx:[],init:false,bk:Date.now(),cats:{exp:['খাবার','যাতায়াত','পড়াশোনা','বই-খাতা','মোবাইল/নেট','অন্যান্য'],inc:['বিক্রি','উপহার','অন্যান্য']}});
let S=(()=>{try{const d=JSON.parse(localStorage.getItem(K));if(d&&Array.isArray(d.tx))return d}catch(e){}return fresh()})(),type='exp',cat='';
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){alert('সেভ করা যায়নি। ফোনের জায়গা বা ব্রাউজারের সেটিং দেখো।')}};
const balance=()=>r2(S.tx.reduce((s,t)=>s+SG[t.t]*t.a,0));

function chips(){const L=S.cats[type];if(!L.includes(cat))cat=L[0];
 $('#chips').innerHTML=L.map(c=>`<button type="button" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}</button>`).join('')+'<button type="button" data-new="1">+ নতুন</button>'}

function render(){
 $('#setup').hidden=S.init;$('#app').hidden=!S.init;
 const m=today().slice(0,7);let i=0,e=0;
 S.tx.forEach(t=>{if(t.d.slice(0,7)===m&&t.c!==START){t.t==='inc'?i+=t.a:e+=t.a}});
 $('#bal').textContent='৳ '+bn(balance());$('#mi').textContent='৳ '+bn(r2(i));$('#me').textContent='৳ '+bn(r2(e));
 $('#bk').hidden=!(S.tx.length&&Date.now()-S.bk>6048e5);
 const tx=[...S.tx].sort((a,b)=>b.d.localeCompare(a.d)||b.ts-a.ts);let h='',last='';
 tx.forEach(t=>{
  if(t.d!==last){last=t.d;h+=`<h2>${t.d===today()?'আজ':new Date(t.d+'T00:00').toLocaleDateString('bn-BD',{day:'numeric',month:'long'})}</h2>`}
  h+=`<div class="it"><div>${esc(t.c)}${t.n?`<small>${esc(t.n)}</small>`:''}</div><span class="a ${t.t}">${t.t==='inc'?'+':'−'}${bn(t.a)}</span><button class="x" data-del="${t.id}" aria-label="মুছো">×</button></div>`});
 $('#list').innerHTML=h||'<p class="empty">এখনও কোনো এন্ট্রি নেই। উপরে টাকার পরিমাণ লিখে প্রথম এন্ট্রি দাও।</p>'}

document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;
 if(b.dataset.t){type=b.dataset.t;document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b));chips()}
 else if(b.dataset.new){const n=(prompt('নতুন ক্যাটাগরির নাম')||'').trim();if(n&&!S.cats[type].includes(n)){S.cats[type].push(n);cat=n;save()}chips()}
 else if(b.dataset.c){cat=b.dataset.c;chips()}
 else if(b.dataset.del){if(confirm('এন্ট্রিটা মুছবে?')){S.tx=S.tx.filter(t=>t.id!==b.dataset.del);save();render()}}
});

$('#f').onsubmit=ev=>{ev.preventDefault();const a=r2(parseFloat($('#amt').value));if(!(a>0))return;
 if(type==='exp'&&a>balance()&&!confirm('হাতে আছে ৳ '+bn(balance())+', এর চেয়ে বেশি খরচ দিচ্ছ। তবুও যোগ করবে?'))return;
 S.tx.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),t:type,a,c:cat,n:$('#note').value.trim(),d:$('#date').value||today(),ts:Date.now()});
 save();$('#amt').value='';$('#note').value='';render();$('#amt').focus()};

$('#sgo').onclick=()=>{const a=r2(parseFloat($('#s0').value)||0);
 if(a>0)S.tx.push({id:'start',t:'inc',a,c:START,n:'',d:today(),ts:Date.now()});
 S.init=true;S.bk=Date.now();save();render();chips()};

const dl=()=>{S.bk=Date.now();save();const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'})),a=document.createElement('a');
 a.href=u;a.download='hisab-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1e3);render()};
$('#ex').onclick=$('#bk2').onclick=dl;
$('#im').onclick=()=>$('#file').click();
$('#file').onchange=async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;
 try{const d=JSON.parse(await f.text());if(!Array.isArray(d.tx))throw 0;
  if(!confirm('বর্তমান হিসাব মুছে এই ব্যাকআপের হিসাব বসবে। এগিয়ে যাবে?'))return;
  S=Object.assign(fresh(),d,{init:true});save();render();chips()}
 catch(e){alert('ফাইলটা ঠিক ব্যাকআপ ফাইল নয়।')}};

$('#date').value=today();render();chips();
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
